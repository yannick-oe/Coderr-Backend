[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = [
    "core",
    "auth_app",
    "offers_app",
    "orders_app",
    "reviews_app",
    "base_info_app",
]

[tool.coverage.run]
source = ["."]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/tests.py",
    "manage.py",
    "*/wsgi.py",
    "*/asgi.py",
    "*/settings.py",
    ".venv/*",
]

[tool.coverage.report]
show_missing = true
